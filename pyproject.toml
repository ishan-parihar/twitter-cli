[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "twitter-cli"
version = "0.8.6"
description = "Twitter/X CLI using browser cookies and curl_cffi"
requires-python = ">=3.11"
dependencies = [
    "curl_cffi>=0.7.0",
    "browser-cookie3>=0.10.0",
    "inquirer>=3.4.0",
    "obscura-cookie-manager @ git+https://github.com/ishan-parihar/obscura-cookie-manager.git",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
twitter = "twitter_cli.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]